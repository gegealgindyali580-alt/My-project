<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:">
  <meta name="theme-color" content="#142D4E">
  <title>تسجيل الدخول | مدرسة الحجر الثانوية</title>
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-card">
      <div class="brand-mark">ح</div>
      <p class="eyebrow">بوابة الإدارة التعليمية</p>
      <h1>مدرسة الحجر الثانوية</h1>
      <p class="muted">منصة الإدارة والمتابعة المدرسية</p>
      <div id="seed-notice" class="notice hidden" role="status"></div>
      <form id="login-form">
        <label for="username">اسم المستخدم</label>
        <input id="username" name="username" autocomplete="username" required placeholder="أدخل اسم المستخدم">
        <label for="password">كلمة المرور</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="أدخل كلمة المرور">
          <button class="icon-button" type="button" id="toggle-password" aria-label="إظهار أو إخفاء كلمة المرور">◉</button>
        </div>
        <label class="check-line"><input type="checkbox" id="remember"> تذكرني لمدة 7 أيام</label>
        <button class="btn btn-primary full" type="submit">تسجيل الدخول</button>
      </form>
      <button class="text-button" id="forgot-password" type="button">نسيت كلمة المرور؟</button>
      <p class="security-note">تنبيه: البيانات التجريبية تحفظ على هذا الجهاز فقط. لا تستخدم بيانات شخصية حقيقية.</p>
    </section>
  </main>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="assets/js/login.js"></script>
</body>
</html>
